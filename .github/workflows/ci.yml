name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up minimum supported Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Test on Python 3.11
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Set up latest stable Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"
          check-latest: true

      - name: Test on latest stable Python
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Validate release package
        run: python scripts/release.py validate

      - name: Check historical behavioral-record integrity
        # Keep prior profiles and failures; they do not accept revised inputs.
        run: |
          for record in tests/trials/behavior-final-{luna,sol}-{1,2,3}-2026-10-12.json tests/trials/behavior-max-luna-2026-10-12.json tests/trials/behavior-max-luna-{2,3}-2026-10-12.json tests/trials/review-{fixes,markdown}-sol-{1,2,3}-2026-11-16.json tests/trials/host-behavior-{core,markdown}-sol-{1,2,3}-2026-11-16.json; do
            python scripts/evaluate.py validate "$record" --require-complete
          done

      - name: Require current simulation profile and distinct run evidence
        # Profile/duplicate checks do not attest independent execution or host UI.
        run: |
          python scripts/evaluate.py validate-suite tests/trials/host-facts-core-sol-{1,2,3}-2026-11-16.json --fixtures tests/cases.json --model gpt-6.1-sol --reasoning-effort high --invocation-mode independent-agent-simulation --min-runs 3 --require-current --require-complete --require-pass
          python scripts/evaluate.py validate-suite tests/trials/host-facts-markdown-sol-{1,2,3}-2026-11-16.json --fixtures tests/changes-markdown-cases.json --model gpt-6.1-sol --reasoning-effort high --invocation-mode independent-agent-simulation --min-runs 3 --require-current --require-complete --require-pass

      - name: Install asset verification decoder
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes webp

      - name: Decode runtime icon
        run: dwebp assets/icon.webp -o "${RUNNER_TEMP}/english-proofreader-pro-icon.png"

      - name: Build allowlisted plugin archive
        run: python scripts/release.py build

      - name: Upload archive for review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: english-proofreader-pro-plugin
          path: dist/english-proofreader-pro-*.zip
          if-no-files-found: error
          retention-days: 14
