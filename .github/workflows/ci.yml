name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up minimum supported Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Test on Python 3.11
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Set up latest stable Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
          check-latest: true

      - name: Test on latest stable Python
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Validate release package
        run: python scripts/release.py validate

      - name: Check historical behavioral-record integrity
        # Keep prior profiles and failures; they do not accept revised inputs.
        run: |
          for record in tests/trials/behavior-final-{luna,sol}-{1,2,3}-2026-10-12.json tests/trials/behavior-max-luna-2026-10-12.json tests/trials/behavior-max-luna-{2,3}-2026-10-12.json tests/trials/review-{fixes,markdown}-sol-{1,2,3}-2026-11-16.json tests/trials/host-behavior-{core,markdown}-sol-{1,2,3}-2026-11-16.json tests/trials/host-facts-{core,markdown}-sol-{1,2,3}-2026-11-16.json tests/trials/audit-fixes-{core,markdown,fragments}-sol-{1,2,3}-2026-11-25.json tests/trials/count-routing-{core,markdown,fragments}-sol-{1,2,3}-2026-11-25.json; do
            python scripts/evaluate.py validate "$record" --require-complete
          done

      - name: Verify unchanged behavior for the metadata-only 1.0.10 release
        # The reviewed receipt permits only version/release_notes changes.
        # Existing strict suites and execution checks run with their exact frozen
        # baseline manifest in isolation; old captures stay historical for 1.0.10.
        # A future behavior release must switch to fresh current evidence.
        run: python scripts/check_metadata_release.py tests/metadata-release-1.0.10.json

      - name: Install asset verification decoder
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes webp

      - name: Decode runtime icon
        run: dwebp assets/icon.webp -o "${RUNNER_TEMP}/english-proofreader-pro-icon.png"

      - name: Build allowlisted plugin archive
        run: python scripts/release.py build

      - name: Upload archive for review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: english-proofreader-pro-plugin
          path: dist/english-proofreader-pro-*.zip
          if-no-files-found: error
          retention-days: 14
